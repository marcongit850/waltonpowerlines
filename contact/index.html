<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us — Walton Power Lines</title>
  <meta name="description" content="Send a note about phased undergrounding in Walton County. It is not a vote or a petition.">
  <link rel="canonical" href="https://waltonpowerlines.com/contact/">
  <meta property="og:title" content="Contact Us — Walton Power Lines">
  <meta property="og:description" content="Send a note about phased undergrounding in Walton County. It is not a vote or a petition.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://waltonpowerlines.com/contact/">
  <meta property="og:image" content="https://waltonpowerlines.com/images/og.png">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0c3554">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="../favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <script src="../header.js"></script>
  <main id="content">
    <header class="page-hero">
      <div class="wrap">
        <p class="kicker">Contact Us</p>
        <h1>A note, not a vote</h1>
        <p class="lede">If you live, work, or own property in Walton County, you can send a note. It does not sign a petition, set a tax, or tell the county commission how to vote.</p>
      </div>
    </header>

    <section class="section">
      <div class="wrap">
        <figure class="photo-band">
          <img src="../images/involved-miramar-beach.jpg" alt="The Gulf shoreline at Miramar Beach in Walton County.">
        </figure>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <form class="form-card" data-contact-form action="/api/contact" method="post">
          <h2>Contact us</h2>
          <div class="hp" aria-hidden="true">
            <label for="company">Company</label>
            <input id="company" name="company" type="text" tabindex="-1" autocomplete="off" value="">
          </div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required maxlength="80">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
          <label for="message">Message <span class="note">(optional)</span></label>
          <textarea id="message" name="message" maxlength="4000"></textarea>
          <div class="actions">
            <button class="btn" type="submit">Submit</button>
          </div>
          <p class="form-status" data-form-status role="status" aria-live="polite" hidden></p>
        </form>
      </div>
    </section>
  </main>
  <script src="../footer.js"></script>
  <script src="../site.js"></script>
</body>
</html>
